		<script>
			$(function () {
				$('#exampleModal').on('show.bs.modal', function (event) {
					var button = $(event.relatedTarget)
					var price = button.data('price');
					var z_pr = button.data('zpr');
					var gupiao = button.data('gupiao');
					var gupiaono = button.data('gupiaono');
					$('#price').val(price);
					$('#gupiao').val(gupiao);
					$('#gupiaono').val(gupiaono);
					$('#z_pr').val(z_pr);
				})
				//保存最新价格
				$('#addoredit').on('click', function () {
					var price = $("#price").val();
					var gupiaono = $("#gupiaono").val();
					var z_pr = $("#z_pr").val();
					var gupiao = $("#gupiao").val();
					if (gupiaono == '' || price == '' || z_pr == '') {
						alert("请输入正确的信息！");
						return;
					}

					$.ajax({
						url: 'user.php?rec=savesanban',
						type: 'post',
						dataType: 'json',
						data: {
							gupiao: gupiao,
							gupiaono: gupiaono,
							price: price,
							z_pr: z_pr
						},
						error: function () {
							alert('出现错误！');
						},
						success: function (data) {
							if (data == 1) {
								$('#exampleModal').modal('hide');
								location.reload();
							} else {
								alert('提交失败！');
							}
						}
					});
				});

			})

			function delgp(id) {
				// Add confirmation dialog before deletion
				const confirmed = confirm("确定要删除这条转账记录吗?");
				if (!confirmed) return;

				$.post(host + "php/user.php", {
					rec: "deletejy",
					id: id,
					username: Global_Username
				}).done(function (data) {
					console.log("Delete response:", JSON.stringify(data));

					if (data.status == "SUCCESS") {
						alert("Successfully deleted: " + data.beizhu);
						qinghuancun();
						location.reload();
					} else {
						// Handle failure cases
						alert("Deletion failed: " + (data.beizhu || "Unknown error"));
					}
				}).fail(function (jqXHR, textStatus, errorThrown) {
					// Handle AJAX errors
					console.error("Delete error:", textStatus, errorThrown);
					alert("Deletion failed: " + textStatus);
				});
			}

			function editgp(id, type) {
				if (type == 0) {
					window.location.href = "mr.html?id=" + id
				} else {
					window.location.href = "mc.html?id=" + id
				}
			}
			function PC_Tiao(data, remToPx, NewBarHeight = 0) {
				var OldBarHeight = NewBarHeight;
				var DqBarHeight = 2; //单位rem;
				viewRemWidth = window.innerWidth / remToPx;
				NewBarHeight = viewRemWidth * data.BarHeight / data.BarWidth
				if (NewBarHeight == NaN) {
					NewBarHeight = OldBarHeight;
				}
				$(".mobile2").css("margin-top", NewBarHeight + "rem");
				$("#wrapper").css("margin-top", NewBarHeight + "rem");
				$(".ztlyanse").css("height", NewBarHeight + "rem");
				$(".back").css("top", NewBarHeight + "rem");
			}
