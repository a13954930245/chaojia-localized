<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>K线测试</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #chart { width: 800px; height: 500px; }
        #status { margin: 10px 0; padding: 10px; background: #f0f0f0; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>K线功能测试</h1>
    <div>
        <button onclick="loadKline('day')">日线</button>
        <button onclick="loadKline('5min')">5分钟</button>
        <button onclick="loadKline('week')">周线</button>
    </div>
    <div id="status">等待加载...</div>
    <div id="chart"></div>

    <script>
        var chart = echarts.init(document.getElementById('chart'));

        function stockSecIdFor(code) {
            var c = String(code || '').replace(/\D/g, '');
            if (!c) return '0.' + code;
            var prefix = (c.startsWith('6') || c.startsWith('5') || c.startsWith('9')) ? '1.' : '0.';
            return prefix + c;
        }

        function loadKline(period) {
            var code = '000001';
            var secid = stockSecIdFor(code);
            var kltMap = { '5min': 5, 'day': 101, 'week': 102, 'month': 103, '5day': 105 };
            var klt = kltMap[period];
            var statusEl = document.getElementById('status');
            statusEl.textContent = '加载中 ' + period + '...';

            var proxyUrl = '/api/kline?secid=' + secid + '&klt=' + klt;
            var directUrl = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=' + secid +
                            '&klt=' + klt + '&fqt=1&beg=20240101&end=20991231&lmt=300' +
                            '&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61';

            console.log('[测试] 尝试代理:', proxyUrl);

            fetch(proxyUrl)
                .then(function(response) {
                    console.log('[测试] 代理响应:', response.status);
                    if (response.ok) return response.json();
                    throw new Error('代理不可用');
                })
                .then(function(payload) {
                    console.log('[测试] 代理成功, rc:', payload.rc);
                    if (payload.rc !== 0) throw new Error('接口错误: ' + payload.rc);
                    if (!payload.data || !payload.data.klines || payload.data.klines.length === 0) {
                        throw new Error('无数据');
                    }
                    return payload.data.klines;
                })
                .catch(function(err) {
                    console.log('[测试] 代理失败，尝试直接请求:', err.message);
                    console.log('[测试] 直接URL:', directUrl);
                    return fetch(directUrl)
                        .then(function(response) {
                            console.log('[测试] 直接响应:', response.status);
                            if (!response.ok) throw new Error('直接请求失败');
                            return response.json();
                        })
                        .then(function(payload) {
                            console.log('[测试] 直接成功, rc:', payload.rc);
                            if (payload.rc !== 0) throw new Error('接口错误: ' + payload.rc);
                            if (!payload.data || !payload.data.klines || payload.data.klines.length === 0) {
                                throw new Error('无数据');
                            }
                            return payload.data.klines;
                        });
                })
                .then(function(klines) {
                    console.log('[测试] 获取到', klines.length, '条数据');
                    var data = klines.map(function(line) {
                        var parts = line.split(',');
                        return [parts[0], parseFloat(parts[1]), parseFloat(parts[3]), parseFloat(parts[2]), parseFloat(parts[4]), parseFloat(parts[5])];
                    });
                    renderChart(data);
                    statusEl.textContent = '加载成功! 共 ' + klines.length + ' 条K线';
                })
                .catch(function(err) {
                    console.error('[测试] 最终失败:', err);
                    statusEl.textContent = '加载失败: ' + err.message;
                });
        }

        function renderChart(data) {
            var dates = [], values = [], volumes = [];
            data.forEach(function(item) {
                dates.push(item[0]);
                values.push([item[1], item[2], item[4], item[3]]);
                volumes.push(item[5]);
            });

            chart.setOption({
                grid: [
                    { left: 50, right: 50, top: 20, height: "60%" },
                    { left: 50, right: 50, top: "75%", height: "18%" }
                ],
                tooltip: { trigger: "axis", axisPointer: { type: "cross" } },
                xAxis: [
                    { type: "category", data: dates, gridIndex: 0, axisLabel: { color: "#999" } },
                    { type: "category", data: dates, gridIndex: 1, axisLabel: { show: false } }
                ],
                yAxis: [
                    { type: "value", gridIndex: 0, scale: true, axisLabel: { color: "#999" } },
                    { type: "value", gridIndex: 1, min: 0, axisLabel: { show: false } }
                ],
                series: [
                    {
                        name: "K线",
                        type: "candlestick",
                        xAxisIndex: 0, yAxisIndex: 0,
                        data: values,
                        itemStyle: { color: "#ef2f37", color0: "#08a94b", borderColor: "#ef2f37", borderColor0: "#08a94b" }
                    },
                    {
                        name: "成交量",
                        type: "bar",
                        xAxisIndex: 1, yAxisIndex: 1,
                        data: volumes.map(function(v, i) {
                            return { value: v, itemStyle: { color: values[i][1] >= values[i][0] ? "#ef2f37" : "#08a94b" } };
                        })
                    }
                ]
            });
        }
    </script>
</body>
</html>
