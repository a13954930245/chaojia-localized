		$("#userset").submit(function (event) {
			event.preventDefault();

			// 1. Get the selected value from the dropdown
			var selectedUiMode = $("#darkModeToggle").val(); // "true" or "false"
			// Convert to the "True"/"False" format the backend expects
			var backendFormat = (selectedUiMode === "true") ? "True" : "False";

			// 2. Prepare the data to send
			var formDataArray = $(this).serializeArray();
			formDataArray = formDataArray.map(function (item) {
				if (item.name === "darkModeToggle") {
					return { name: "darkModeToggle", value: backendFormat };
				}
				return item;
			});

			$.ajax({
				type: "POST",
				url: host + "php/user.php",
				data: $.param(formDataArray),
				dataType: "json", // Ensure we expect JSON
				success: function (response) {
					if (response.status === "SUCCESS" || response.name) {

                                                // local-api returns the complete updated account.
                                                // Persist it so every setting is visible after navigation.
                                                if (response.userdata) {
                                                        localStorage.setItem("loginData", JSON.stringify(response));

						localStorage.removeItem("QxstockDataqxmonth");
						localStorage.removeItem("QxstockDataqxthree");
						localStorage.removeItem("QxstockDataqxyear");
						localStorage.removeItem("QxstockDataall");

						alert("设置成功！");
						window.location.href = "index.html";
					} else {
						alert("保存失败: " + (response.beizhu || "未知错误"));
					}
