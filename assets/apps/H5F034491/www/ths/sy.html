					<script>
						var nav = $("#navcss").val();

						$('.tab-item').eq(nav).addClass("tab-item-active");

						$('.bzixuan').click(function() {

						document.addEventListener('DOMContentLoaded', function() {
							const carouselContent = document.getElementById('carouselContent');
							const items = document.querySelectorAll('.carousel-item');
							const totalItems = items.length;
							let currentIndex = 0;
							let intervalDuration = 3000; // 3秒停留

							function startCarousel() {
								setInterval(function() {
									currentIndex++;
									if (currentIndex >= totalItems) {
										currentIndex = 0; // 如果到达最后一行，重新开始
									}
									updateCarousel();
								}, intervalDuration);
							}

							function updateCarousel() {
								const translateY = -currentIndex * 1.73; // 50px 是每行文字的高度
								carouselContent.style.transform = `translateY(${translateY}rem)`;
							}

							startCarousel(); // 启动轮播
						});
						$(".toplunBo").click(function() {
							$(".addBox").css("display", "block");
						});
						$(".close-btn").click(function() {
							$(".addBox").css("display", "none");
						})
						$(".UploadBack").click(function() {
							$("#UploadFile").click();
						})
						$("#UploadFile").change(function() {
							// this.files[0]代表的是选择的文件资源的第一个，因为上面写了 multiple="multiple" 就表示上传文件可能不止一个
							let imgname = this.files[0].name;
							var reads = new FileReader();
							f = document.getElementById("UploadFile").files[0];
							reads.readAsDataURL(f);
							reads.onload = function(e) {
								$("#PreviewImg").attr("src", this.result);
							}
							$("#UploadFile").val("");
						});
						$(".SaveBack").click(function() {

							var option = $("#SelectTime").val();
							//获取用户名：
							var LocalBsGpData = localStorage.getItem("LocalBsGpData");
							LocalBsGpData = JSON.parse(LocalBsGpData);
							if (LocalBsGpData) {
								var localData = LocalBsGpData;
							} else {
								var localData = {};
							}
							username = Global_username;
							if (localData[username]) {
								var GpData = localData[username];
							} else {
								var GpData = {};
							}
							if (GpData["sy"]) {
								var syLocalData = GpData["sy"];
							} else {
								var syLocalData = {};
							}


							var Imgsrc = $("#PreviewImg").attr("src");
							var hang1 = $(".hang1").val();
							var hang2 = $(".hang2").val();
							var hang3 = $(".hang3").val();
							var hang4 = $(".hang4").val();
							var hang5 = $(".hang5").val();
							var hang6 = $(".hang6").val();
							syLocalData["hang1"] = hang1;
							syLocalData["hang2"] = hang2;
							syLocalData["hang3"] = hang3;
							syLocalData["hang4"] = hang4;
							syLocalData["hang5"] = hang5;
							syLocalData["hang6"] = hang6;
							syLocalData["back"] = Imgsrc;
							GpData["sy"] = syLocalData;
							localData[username] = GpData;
							localStorage.setItem("LocalBsGpData", JSON.stringify(localData));
							location.reload();
						});



						var loginData = localStorage.getItem("loginData");
						if (loginData) {
							loginData = JSON.parse(loginData);
							Global_username = loginData.userdata.username;

							LocalBsGpData = localStorage.getItem("LocalBsGpData");
							loadsyData();
						}

						function loadsyData() {
							username = Global_username;
							if (LocalBsGpData) {
								var localData = JSON.parse(LocalBsGpData);
								GpData = localData[username];
								syLocalData = GpData["sy"];
								if (syLocalData["back"] != "") $(".zhujiemian").attr("src", syLocalData["back"]);
								$("#PreviewImg").attr("src", syLocalData["back"]);
								$(".hang1").val(syLocalData["hang1"]);
								if (syLocalData["hang1"] != "") $(".carousel-item:eq(0)").html(syLocalData["hang1"]);
								$(".hang2").val(syLocalData["hang2"]);
								if (syLocalData["hang2"] != "") $(".carousel-item:eq(1)").html(syLocalData["hang2"]);
								$(".hang3").val(syLocalData["hang3"]);
								if (syLocalData["hang3"] != "") $(".carousel-item:eq(2)").html(syLocalData["hang3"]);
								$(".hang4").val(syLocalData["hang4"]);
								if (syLocalData["hang4"] != "") $(".carousel-item:eq(3)").html(syLocalData["hang4"]);
								$(".hang5").val(syLocalData["hang5"]);
								if (syLocalData["hang5"] != "") $(".carousel-item:eq(4)").html(syLocalData["hang5"]);
								$(".hang6").val(syLocalData["hang6"]);
								if (syLocalData["hang6"] != "") $(".carousel-item:eq(5)").html(syLocalData["hang6"]);


							}
						}

							viewRemWidth = window.innerWidth / remToPx;
							NewBarHeight = viewRemWidth * data.BarHeight / data.BarWidth
							if (NewBarHeight == NaN) {
								NewBarHeight = OldBarHeight;
							}
							$("#wrapper").css("margin-top", (NewBarHeight + 0.6) + "rem");
							$("#header").css("margin-top", NewBarHeight + "rem");
							$(".ztlyanse").css("height", (NewBarHeight + 0.2) + "rem");
							$(".mobile2").css("margin-top", (NewBarHeight + 0.5) + "rem");
							$(".toplunBo").css("top", 2.57 + "rem");
							$(".mobiletop2").css("top", (NewBarHeight - 2) + "rem");
							$(".contentBox").css("top", (NewBarHeight - 2) + "rem");
							if (Global_PhoneType == "Apple") {
								if ($(".tab-nav2") && $(".tabs2") && $(".tab-nav2 img").attr("src") == "./hangqing/sy_bottom.png") {
									$(".tab-nav2 img").attr("src", "./hangqing/sy_bottom_ios.png");
									$(".navbarf2 .tab-nav1").css("bottom", "4.7rem");
									$(".tab-nav2 a").css("height", "4.8rem");
								}
							}
