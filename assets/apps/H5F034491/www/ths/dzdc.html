    <script>

        $(document).on("click", '.dzbox-icon', function () {
            $('.jdshow').toggle();
            $(this).children('.jd').css("transform", "rotate(-45deg)");
            if ($('.jdshow').is(':visible')) {
                $(this).children('.jdx').css("transform", "rotate(-45deg)");
            } else {
                $(this).children('.jdx').css("transform", "rotate(-225deg)");
            }
        });
        let masked = false;
        const originalTexts = new WeakMap();

        $(document).on("click", '.eye', function () {
            // console.log('click');
            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);

            while (walker.nextNode()) {
                const node = walker.currentNode;

                if (!masked) {
                    // Save original text if it contains digits
                    if (/\d/.test(node.textContent)) {
                        originalTexts.set(node, node.textContent);
                        node.textContent = node.textContent.replace(/[0-9,.+---%]/g, '*');
                    }
                } else {
                    // Restore original text if it was changed
                    if (originalTexts.has(node)) {
                        node.textContent = originalTexts.get(node);
                    }
                }
            }

            masked = !masked;
        });
        // Tab switching functionality
        $('.dzbox-tab').click(function () {
            $('.dzbox-tab').removeClass('active');
            $(this).addClass('active');
            // Add functionality for different tabs here
        });

    </script>

        function displaydzdData(data) {
            if (data.status == "FAIL") {
                window.location.href = "login.html";
            }

            // Update Securities Info
            if (data.userdata) {
                $('.zqname2').contents().filter(function () {
                    return this.nodeType === 3;
                })[0].nodeValue = data.userdata.zhengquanname;
                $('.zqnumber2').text(' ' + data.userdata.zhengquannumber + ' ');
            }

            // --- 1. Calculate Summary Stats ---
            let totalProfit = 0, totalLoss = 0, totalTrades = 0, totalWinTrades = 0, totalLosingTrades = 0;
            let totalMaxProfit = 0, totalMaxLoss = 0;

            data.monthlyData.forEach(item => {
                const stock = item.stocks;
                const profit = stock.amount;
                totalProfit += profit > 0 ? profit : 0;
                totalLoss += profit < 0 ? -profit : 0;
                totalTrades += stock.totalTrades;
                totalWinTrades += stock.winningTrades;
                totalLosingTrades += stock.losingTrades;
                totalMaxProfit = Math.max(totalMaxProfit, stock.maxProfit);
                totalMaxLoss += -Math.abs(stock.maxLoss);
            });

            const winRate = totalTrades > 0 ? (totalWinTrades / totalTrades) * 100 : 0;
            const avgProfit = totalWinTrades > 0 ? totalProfit / totalWinTrades : 0;
            const avgLoss = totalLosingTrades > 0 ? totalLoss / totalLosingTrades : 0;

            // Update Date Range Label
            const dr = data.dateRange;
            if (dr && dr.start) {
                const s = dr.start.split('-');
                const endStr = dr.end === "今天" ? "至今" : dr.end;
                $('#date-range-label').text(`实现总盈亏(${s[0]}年${s[1]}月${s[2]}日-${endStr})`);
            }

            let result = totalProfit - totalLoss;
            $('.yknum1').text((result % 1 === 0) ? result.toFixed(2) : result.toString());
            $('.yknum1').css('color', result < 0 ? '#4691ee' : '#ff2536');
            $('#pjcw').text(winRate.toFixed(2) + '%');
            $('#unijynums').text(data.clearTimes || '--');
            $('#chenggonglv').text(data.holidayData?.average || '--');
            $('#jynums').text(totalTrades || '--');
            $('#yinglinums').text(avgProfit.toFixed(2) || '--');
            $('#kuisunnums').text(avgLoss.toFixed(2) || '--');
            $('#numdays').text('+' + totalMaxProfit.toFixed(2) || '--');
            $('#kuisunmax').text(totalMaxLoss.toFixed(2) || '--');

            // --- 2. DYNAMIC PADDING LOGIC ---
            const width = window.innerWidth;
            let dynamicPadding;

            if (width <= 395) {
                dynamicPadding = "11.2rem"; // iPhone 12/15
            } else if (width > 395 && width <= 420) {
                dynamicPadding = "11.9rem"; // XR / Android
            } else {
                dynamicPadding = "12.5rem"; // Pro Max
            }

            // --- 3. Build the Table Headers ---
            const groupedData = {};
            data.monthlyData.forEach(item => {
                const month = item.month.substring(0, 7);
                if (!groupedData[month]) groupedData[month] = [];
                groupedData[month].push(item.stocks);
            });

            const $tableBody = $('.tablelist tbody');
            $tableBody.empty();

            Object.entries(groupedData).forEach(([month, stocks]) => {
                const total = stocks.reduce((sum, stock) => sum + stock.amount, 0);
                const monthHeaderValue = total > 0 ? '#ff2536' : (total < 0 ? '#4691ee' : '#e93030');

                $tableBody.append(`
            <tr class="month-header">
                <th colspan="4" style="border-bottom: 1px solid #eeeeee; padding: 1.1rem 0 0.6rem 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <div style="display: flex; align-items: center; margin-left: 0.5rem; white-space: nowrap; flex-shrink: 0;">
                            <div class="jdx-tr" style="${stocks.length === 0 ? 'visibility: hidden;' : ''}"></div>
                            <span style="font-size: 1.1rem; padding-left: 0.6rem;">${month}</span>
                        </div>
                        <div class="monthHeaderTotal" style="color: ${monthHeaderValue}; font-size: 1.1rem; font-family: 'DIN'; padding-right: ${dynamicPadding}; flex: 1; text-align: right; font-weight: 500;">
                            ${total > 0 ? '+' : ''}${total === 0 ? '0.00' : total.toFixed(2)}
                        </div>
                    </div>
                </th>
            </tr>
        `);
            });

            // --- 4. ADDED: CLICK EVENT HANDLER (FIXED) ---
            $(document).off('click', '.month-header').on('click', '.month-header', function () {
                const $this = $(this);
                const $icon = $this.find('.jdx-tr');

                // If details are already showing, remove them (Close)
                if ($this.next().hasClass('month-details')) {
                    $this.nextUntil(':not(.month-details)').remove();
                    $icon.css('transform', 'rotate(135deg)');
                }
                // If details are hidden, show them (Open)
                else {
                    const month = $this.find('span').text();
                    const stocks = groupedData[month] || [];

                    if (stocks.length === 0) {
                        $this.after(`<tr class="month-details"><td colspan="4" style="text-align:center;color:#999;">本月无清仓记录</td></tr>`);
                    } else {
                        // Loop through stocks and append detail rows
                        // slice().reverse() ensures the list appears in order
                        stocks.slice().reverse().forEach(stock => {
							const calculatedCost = stock.total - stock.amount;
                            // const profitRate = stock.amount !== 0 ? (stock.total / stock.amount) : 0;
							const profitRate = (calculatedCost !== 0) ? (stock.amount / calculatedCost) * 100 : 0;
                            const amountColor = stock.amount > 0 ? '#e93030' : (stock.amount < 0 ? '#4691ee' : 'black');
                            const profitRateColor = profitRate > 0 ? '#e93030' : (profitRate < 0 ? '#4691ee' : 'black');
                            const change2Color = stock.change2 > 0 ? '#e93030' : (stock.change2 < 0 ? '#4691ee' : 'black');

                            $this.after(`
                        <tr class="month-details">
                            <td>
                                <div class="infofontzw infofontzw0">${stock.name}</div>
                                <div class="infofont">${stock.date} 清仓</div>
                            </td>
                            <td class="amount" style="color: ${amountColor};">${stock.amount || '--'}</td>
                            <td class="profitRate" style="color: ${profitRateColor};">${profitRate.toFixed(2) || '--'}%</td>
                            <td class="market" style="color: ${change2Color};">
                                ${(stock.change2 || stock.change2 === 0) ? parseFloat(stock.change2).toFixed(2) : '0.00'}%
                            </td>
                        </tr>
                    `);
                        });
                        $icon.css('transform', 'rotate(-45deg)');
                    }
                }
            });
        }

        loginstatus(function () {
            var loginData = localStorage.getItem("loginData");
            loginData = JSON.parse(loginData);
            console.log(loginData);

            if (loginData && loginData.userdata) {
                const uData = loginData.userdata;

                // 1. Update Securities Name (e.g., 广发证券)
                // We target only the text node so we don't overwrite the <span> inside
                $('.zqname2').contents().filter(function () {
                    return this.nodeType === 3; // Targets the text "东莞证券"
                })[0].nodeValue = uData.zhengquanname;

                // 2. Update Account Number (e.g., 39****63)
                $('.zqnumber2').text(' ' + uData.zhengquannumber + ' ');
            }
            //存储数据；
            const type = window.location.search || '?default';
            var storageKey = 'myData' + type;
            var storageDateKey = 'dataDate' + type;
            var today = new Date().toISOString().split('T')[0];

            var storedData = localStorage.getItem(storageKey);
            var storedDate = localStorage.getItem(storageDateKey);

            if (storedData != "undefined" && storedDate === today && storedData != "undefined") {
                // Use stored data
                var data = JSON.parse(storedData);
                console.log(data);
                displaydzdData(data);
            } else {
                localStorage.removeItem(storageKey);
                localStorage.removeItem(storageDateKey);
                fetchDatas(type, function (data) {
                    localStorage.setItem(storageKey, JSON.stringify(data));
                    localStorage.setItem(storageDateKey, today);

                    displaydzdData(data);


                });
            }
        });

        $(document).ready(function () {
            $('.yknum1').each(function () {
                // 1. Get the text
                // 2. Remove commas and percent signs so parseFloat works
                var text = $(this).text().trim().replace(/,/g, '').replace(/%/g, '');

                // 3. Convert to a real number
                var value = parseFloat(text);

                // Check if it's a valid number before applying color
                if (!isNaN(value)) {
                    if (value < 0) {
                        $(this).css('color', '#4691ee');
                    } else {
                        $(this).css('color', '#ff2536');
                    }
                }
            });
        });

        // Navigation handling
        // $('.nav-link').click(function () {
        //     // e.preventDefault();
        //     currentSection = $(this).data('section');
        //     $('.nav-link').removeClass('on');
        //     $(this).addClass('on');
        // });

        $(document).ready(function () {
            const query = window.location.search; // e.g., "?monthly"
            $('.nav-link').each(function () {
                if ($(this).attr('href').includes(query)) {
                    $('.nav-link').removeClass('on');
                    $(this).addClass('on');
                }
            });
        });
