<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Function to initialize or re-initialize synchronized scrolling
        window.reinitializeScrolling = function () {
            const navScrollable = document.querySelector('.navicon-scrollable');
            const gplistbox = document.getElementById('gplistbox');

            if (!navScrollable || !gplistbox) {
                console.error("Scrollable elements not found. Cannot initialize synchronized scrolling.");
                return;
            }

            let isSyncingNav = false;
            let isSyncingGp = false;

            const syncScroll = (source, target) => {
                if (source === navScrollable && isSyncingGp) return;
                if (source === gplistbox && isSyncingNav) return;

                if (source === navScrollable) isSyncingNav = true;
                if (source === gplistbox) isSyncingGp = true;

                window.requestAnimationFrame(() => {
                    target.scrollLeft = source.scrollLeft;

                    if (source === navScrollable) isSyncingNav = false;
                    if (source === gplistbox) isSyncingGp = false;
                });
            };

            navScrollable.onscroll = null;
            gplistbox.onscroll = null;

            navScrollable.addEventListener('scroll', () => syncScroll(navScrollable, gplistbox));
            gplistbox.addEventListener('scroll', () => syncScroll(gplistbox, navScrollable));
        };

        setTimeout(() => {
            window.reinitializeScrolling();
        }, 500);

        window.reinitializeScrollingOnDataLoad = function () {
            setTimeout(() => {
                if (typeof window.reinitializeScrolling === "function") {
                    window.reinitializeScrolling();
                }
            }, 200);
        };
    });
</script>

<!-- FINAL SCRIPT for Cross-Platform Action Bar -->
<script>
    $(document).ready(function () {
        const gplistbox = document.getElementById('gplistbox');
        if (!gplistbox) return;

        let touchStartX = 0;
        let touchStartY = 0;
        let touchHandled = false;

        // --- REVISED Centralized Function to Manage the Action Bar ---
        function manageActionbar($item) {
            const isAlreadyActive = $item.hasClass('item-active');

            // --- Always perform cleanup and reset first ---
            $('.gulicz-inserted-actions').remove(); // Remove any previously inserted bar
            $('.gpitem.item-active').removeClass('item-active'); // Remove highlight from the old item

            // If we just clicked the active item, our job is to close it. We're done.
            if (isAlreadyActive) {
                return;
            }

            // --- Create and INSERT the new action bar ---
            const $originalGulicz = $item.find('.gulicz');
            if ($originalGulicz.length === 0) return;

            // Clone the original action bar template
            const $actionBar = $originalGulicz.clone()
                .removeClass('gulicz') // Keep the original hidden
                .addClass('gulicz-inserted-actions') // Add our new class for styling
                .css('display', 'flex'); // Ensure it's displayed

            // **THE KEY CHANGE**: Insert the new action bar into the document
            // flow, right after the item that was clicked.
            $item.after($actionBar);

            // Add a class to the clicked item for styling
            $item.addClass('item-active');
        }


        // --- Touch Event Handlers for iOS/Android responsiveness (No changes needed here) ---
        gplistbox.addEventListener('touchstart', function (e) {
            const targetRow = e.target.closest('.gpitem');
            if (!targetRow) return;

            touchHandled = false;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        gplistbox.addEventListener('touchend', function (e) {
            const targetRow = e.target.closest('.gpitem');
            if (!targetRow) return;

            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const deltaX = Math.abs(touchEndX - touchStartX);
            const deltaY = Math.abs(touchEndY - touchStartY);

            if (deltaX < 10 && deltaY < 10) { // It's a TAP
                if (touchHandled) return;
                touchHandled = true;

                manageActionbar($(targetRow));
                e.preventDefault(); // Prevent ghost click
            }
        }, false);

        // --- Fallback Click Handler for Desktops and Android (No changes needed here) ---
        $(gplistbox).on('click', '.gpitem', function () {
            if (touchHandled) {
                touchHandled = false; // Reset for next interaction
                return;
            }
            manageActionbar($(this));
        });
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const scrollContainer = document.getElementById('gplistbox');
        // Key Change: Select all elements with the .liname class
        const fixedElements = document.querySelectorAll('.liname');

        if (!scrollContainer || fixedElements.length === 0) {
            return; // Exit if the necessary elements aren't on the page
        }

        // Use a Map to store the original top offset for each element
        const initialOffsets = new Map();

        // --- Function to calculate and store initial positions ---
        function recordInitialPositions() {
            const containerRect = scrollContainer.getBoundingClientRect();
            fixedElements.forEach(el => {
                // Temporarily reset style to get the "natural" position in the flow
                el.style.top = '';
                const elRect = el.getBoundingClientRect();
                const initialTop = elRect.top - containerRect.top;
                initialOffsets.set(el, initialTop);
            });
            // After recording, update positions immediately
            updatePositions();
        }

        // --- Function to update positions on scroll ---
        function updatePositions() {
            const scrollTop = scrollContainer.scrollTop;
            const containerRect = scrollContainer.getBoundingClientRect();

            fixedElements.forEach(el => {
                const initialTop = initialOffsets.get(el);
                if (initialTop === undefined) return; // Skip if no offset was recorded

                // Calculate the new 'top' position
                const newTop = initialTop - scrollTop;

                // Apply the final style, pinning it relative to the viewport
                el.style.top = (containerRect.top + newTop) + 'px';
            });
        }

        // --- Event Listeners ---

        // Listen for scroll events on the container
        scrollContainer.addEventListener('scroll', updatePositions);

        // Use ResizeObserver to automatically recalculate if container size changes
        // This is more efficient than the old 'window.onresize'
        const resizeObserver = new ResizeObserver(() => {
            recordInitialPositions();
        });
        resizeObserver.observe(scrollContainer);

        // Initial setup
        recordInitialPositions();
    });
</script>
