				<script type="text/javascript">
					$(document).on("click", '.dzlist', function () {
						var $dzlistCon = $(this).children('.dzlist-con');
						var $jd = $(this).find('.jd');

						$dzlistCon.toggle();  // Toggle the visibility of .dzlist-con

						if ($dzlistCon.is(':visible')) {
							// Add the span with class .tr-border before and after the .tablelist if not already present
							if ($dzlistCon.find('.tr-border').length == 0) {
								$dzlistCon.prepend('<span class="tr-border-span"></span>');  // Add span before the table with padding: 0
								$dzlistCon.append('<span class="tr-border-span"></span>');   // Add span after the table with padding: 0
							}
							$jd.css("transform", "rotate(-45deg)");  // Rotate .jd to -45deg when .dzlist-con is visible
						} else {
							$jd.css("transform", "rotate(-225deg)"); // Rotate .jd back to -225deg when .dzlist-con is hidden
							// Remove the .tr-border spans when the content is hidden
							$dzlistCon.find('.tr-border').remove();
						}
					});

					$(document).on("click", '.dzbox-icon', function () {

						$('.jdshow').toggle();
						$(this).children('.jd').css("transform", "rotate(-45deg)");
						if ($('.jdshow').is(':visible')) {
							$(this).children('.jdx').css("transform", "rotate(-45deg)");

						} else {
							$(this).children('.jdx').css("transform", "rotate(-225deg)");


						}
					});

					loginstatus(function () {
						//存储数据；
						var storageKey = 'myData' + type;
						var storageDateKey = 'dataDate' + type;
						var today = new Date().toISOString().split('T')[0];

						var storedData = localStorage.getItem(storageKey);
						var storedDate = localStorage.getItem(storageDateKey);

						if (storedData != "undefined" && storedDate === today && storedData != "undefined") {
							// Use stored data
							var data = JSON.parse(storedData);
							displaydzdData(data);
						} else {
							localStorage.removeItem(storageKey);
							localStorage.removeItem(storageDateKey);
							fetchDatas(type, function (data) {
								localStorage.setItem(storageKey, JSON.stringify(data));
								localStorage.setItem(storageDateKey, today);
								displaydzdData(data);
							});

						}
					});

					function fetchDatas(type, callback) {
						$.post(host + "php/user.php", {
							rec: "dzdload",
							type: type,
							username: Global_Username
						})
							.done(function (data) {
								console.log(data);
								callback(data);
							})
					}

					function PC_Tiao(data, remToPx, NewBarHeight = 0) {
						var OldBarHeight = NewBarHeight;
						var DqBarHeight = 2; //单位rem;
						viewRemWidth = window.innerWidth / remToPx;
						NewBarHeight = viewRemWidth * data.BarHeight / data.BarWidth
						if (NewBarHeight == NaN) {
							NewBarHeight = OldBarHeight;
						}

						document.addEventListener('plusready', function () {
							plus.navigator.setStatusBarBackground(Global_BarColor); // 黄色背景
							plus.navigator.setStatusBarStyle("light");
						});
						$(".mobile2").css("margin-top", NewBarHeight + "rem");
						$(".ztlyanse").css("height", NewBarHeight + "rem");
					}
				</script>
