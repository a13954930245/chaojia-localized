	var currentStep = 0;

	function startGuide() {
		currentStep = 0;
		showGuideStep(currentStep);
	}

	function showGuideStep(stepIndex) {
		if (stepIndex >= guideSteps.length) {
			hideGuide();
			return;
		}

		var step = guideSteps[stepIndex];
		var $target = $(step.element);
		var $guide = $('#guideDiv');
		var $arrow = $('#guideArrow');

		var targetOffset = $target.offset();
		var targetWidth = $target.outerWidth();
		var targetHeight = $target.outerHeight();
		var guideWidth = $guide.outerWidth();
		var guideHeight = $guide.outerHeight();

		var targetTop = targetOffset.top + (targetHeight / 2);
		var targetLeft = targetOffset.left + (targetWidth / 2);

		// 计算引导位置，确保不会超出手机屏幕，并且不会遮挡目标元素
		var top = targetOffset.top - guideHeight - 60; // 60是箭头和箭头的线的高度
		if (top < 0) {
			top = targetOffset.top + targetHeight + 20; // 20是距离目标元素的间距
		}

		var left = targetOffset.left + (targetWidth / 2) - (guideWidth / 2);
		if (left < 0) {
			left = 10; // 10是左边距
		} else if (left + guideWidth > $(window).width()) {
			left = $(window).width() - guideWidth - 10; // 10是右边距
		}

		// 设置引导 div 和箭头的位置
		$guide.css({
			top: top,
			left: left
		});

		$arrow.css({
			top: top + guideHeight,
			left: targetLeft,
			height: 50 + targetHeight / 2
		});

		$('#guideContent').text(step.content);
		$guide.show();

		var $newDiv = $('<div></div>');
		$newDiv.css({
			'background': 'rgba(0, 0, 0, 0.5)',
			'width': targetWidth + 'px',
			'height': targetHeight + 'px',
			'position': 'fixed',
			'left': targetOffset.left + 'px',
			'top': targetOffset.top + 'px',
			'z-index': 999999999
		});
		$('.YindaoClass').append($newDiv);

		setTimeout(function () {
			$newDiv.remove();
		}, 3000)
	}

	function nextGuide() {
		currentStep++;
		showGuideStep(currentStep);
		if (guideSteps.length - 1 == currentStep) {
			$(".guide button").html("结束");
		}
	}

	function hideGuide() {
		$('#guideDiv').hide();

	}

<script>
	(function () {
		// Check if the navigation type is NOT a reload
		// (Type 0 = Navigate, Type 1 = Reload, Type 2 = Back/Forward)
		var navType = window.performance.getEntriesByType("navigation")[0].type;

		if (navType !== 'reload') {
			// If we haven't refreshed yet during this specific navigation visit
			if (!sessionStorage.getItem('isRefreshed')) {
				sessionStorage.setItem('isRefreshed', 'true');
				window.location.reload();
			}
		} else {
			// If the user manually reloads, or after our auto-reload is done, 
			// we clear the flag so it's ready for the next time they come from another page
			sessionStorage.removeItem('isRefreshed');
		}
	})();
