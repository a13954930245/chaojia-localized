<body>
    <div class="main">

    <script>
        const mobiletop2 = document.getElementById('mobiletop2');

        // const isIphone14ProMax = /iPhone/.test(navigator.userAgent) && window.screen.height === 932 && window.screen.width === 430;

        // if (isIphone14ProMax) {

    </script>
    <script>
        $(document).ready(function () {
            function updateFundBalance() {
                if (!window.LocalAPI || !LocalAPI.calculateAccount) return;
                var account = LocalAPI.calculateAccount(Global_Username);
                $('#fundBalance').text('(资金余额：' + Number(account.cash || 0).toFixed(2) + ')');
            }

            loginstatus(function (data) {
                //存储数据；
                var type = '?all';
                var storageKey = 'myData' + type;
                var storageDateKey = 'dataDate' + type;
                var today = new Date().toISOString().split('T')[0];

                var storedData = localStorage.getItem(storageKey);
                var storedDate = localStorage.getItem(storageDateKey);

                if (storedData != "undefined" && storedDate === today && storedData != "undefined") {
                    // Use stored data
                    var data = JSON.parse(storedData);
                } else {
                    localStorage.removeItem(storageKey);
                    localStorage.removeItem(storageDateKey);
                    // loadTransactions(type, function (data) {
                    //     localStorage.setItem(storageKey, JSON.stringify(data));
                    //     localStorage.setItem(storageDateKey, today);
                    // });

                }
				if (data.userdata) {
					$(".zqname2").html(data.userdata.zhengquanname+"<span class=\"zqnumber2\"> "+data.userdata.zhengquannumber+" </span>");
				
				}
                updateFundBalance();
            });


            // Navigation handling
            $('.nav-link').click(function (e) {
                e.preventDefault();
                currentSection = $(this).data('section');
                $('.nav-link').removeClass('on');
                $(this).addClass('on');
                $('#form, #query').hide();
                $('#' + currentSection).show();
                if (currentSection === 'query') {
                    loadTransactions('?all');
                }
            });

            // Form submission handling
            $('#yinzhengzz').on('submit', function (e) {
                e.preventDefault();
                const formData = {
                    zztype: $('#zztype').val(),
                    zijinjine: $('#zijinjine').val(),
                    timeriqi: $('#timeriqi').val(),
                    timem: $('#timem').val(),
                    action: 'submit_transfer',

                };

                // Validation
                if (!formData.zztype || !formData.timeriqi || !formData.zijinjine) {
                    showError('转账类型和转账日期是必填项！');
                    return;
                }

                if (formData.zijinjine && isNaN(formData.zijinjine)) {
                    showError('请输入有效的金额数字！');
                    return;
                }
                // console.log("here", formData);

                $.ajax({
                    url: host + "php/user.php",
                    type: "POST",
                    data: $.extend({
                        rec: 'shu-recieve', // Custom parameter
                        username: Global_Username,
                        params: '?date'
                    }, formData),
                    success: function (response) {
                        console.log(response);
                        try {
                            if (response.status) {
                                showSuccess('转账提交成功！');
                                updateFundBalance();
                                $('#form').hide();
                                $('#query').show();
                                renderTransactions(response.data);
                                clearForm();
                            } else {
                                showError(response.message || '提交失败');
                            }
                        } catch (e) {
                            showError('响应解析失败');
                        }
                    },
                    error: function () {
                        showError('网络错误');
                    }
                });
            });

            // Transaction loading
            function loadTransactions(params) {
                $.ajax({
                    url: host + "php/user.php",
                    type: "POST",
                    data: {
                        rec: "shu-recieve",
                        username: Global_Username,
                        params: params
                    },
                    success: function (transactions) {
                        try {
                            renderTransactions(transactions.data);
                        } catch (e) {
                            console.error("Error parsing transactions:", e);
                            renderFallbackTransactions();
                        }
                    },
                    error: function () {
                        renderFallbackTransactions();
                    }
                });
            }

            function renderFallbackTransactions() {
                $('.zzdrlist').show();
                $('.zzdrlist').html(`
                <ul>
                    <li><span>号码</span>0</li>
                    <li><span>操作</span>买入</li>
                    <li><span>时间</span>00:32:10</li>
                    <li><span>金额</span>xxxxx.00</li>
                    <li><span>操作</span><a class="delzz">删除</a></li>
                </ul>
            `);
            }
            // Transaction rendering
            function renderTransactions(transactions) {
                $('.zzdrlist').show();
                const container = $('.zzdrlist');
                container.empty();

                if (!transactions.length) {
                    container.append('<div class="no-data">没有转账记录</div>');
                    return;
                }

                transactions.forEach(item => {
                    // console.log("HERE", item)
                    container.append(`
                        <ul data-id="${item.id}">                           
                            <li><span>类型</span>${item.type || ''}</li>
                            <li><span>日期</span>${item.date || ''}</li>
                            <li><span>时间</span>${item.time || ''}</li>
                            <li><span>金额</span>${item.amount || '无金额'}</li>
                            <li><span>操作</span><a class="delzz" href="javascript:void(0);">删除</a></li>
                        </ul>
                    `);
                });
            }

            // Delete handling
            $(document).on('click', '.delzz', function (e) {
                e.preventDefault();
                const el = $(this).closest('ul');
                const id = el.data('id');

                if (id && confirm('确定要删除这条转账记录吗?')) {
                    $.ajax({
                        url: host + "php/user.php",
                        type: "POST",
                        data: {
                            rec: "shu-deleteTransaction",
                            username: Global_Username,
                            transaction_id: id
                        },
                        success: function (result) {
                            const data = typeof result === 'string' ? JSON.parse(result) : result;
                            if (data.status === "success") {
                                el.remove();
                            } else {
                                alert(data.message || '删除失败');
                            }
                        },
                        error: function () {
                            alert('删除错误');
                        }
                    });
                }
            });

            // Helper functions
            function showError(msg) {
                $('#memo').css('color', 'red').text(msg).show();
            }

            function showSuccess(msg) {
                $('#memo').css('color', 'green').text(msg).show();
            }

            function clearForm() {
                $('#yinzhengzz')[0].reset();
                $('#timem').val('00:00');
            }

            // Initial setup
            $('#timem').val('00:00');
            $('#zijinjine').on('input', function () {
                this.value = this.value.replace(/[^0-9.]/g, '');
            });
        });
    </script>
