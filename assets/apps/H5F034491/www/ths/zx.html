					<script>

                                          var currentStockMode = "watch";
                                          var visibleQuoteStocks = [];
                                          var quoteRefreshTimer = null;

                                         function normalizeStockCode(value) {
                                                 return String(value || "").replace(/\D/g, "");
                                         }

                                         function stockSymbolFor(code) {
                                                 if (/^[48]/.test(code)) return "bj" + code;
                                                 if (/^[569]/.test(code)) return "sh" + code;
                                                 return "sz" + code;
                                         }

                                         function parseStockQuote(payload, symbol, code) {
                                                 var market = payload && payload.data && payload.data[symbol];
                                                 var quote = market && (
                                                         (market.qt && market.qt[symbol]) ||
                                                         (market.data && market.data.qt && market.data.qt[symbol])
                                                 );
                                                 if (!quote || !quote[1]) return null;

                                                 var returnedCode = String(quote[2] || "").replace(/\D/g, "").slice(-6);
                                                 if (returnedCode && returnedCode !== code) return null;

                                                 var ticks = market && market.data && market.data.data;
                                                 var price = parseFloat(quote[3]);
                                                 var close = parseFloat(quote[4]);
                                                 if (!isFinite(price) && ticks && ticks.length) {
                                                         price = parseFloat(String(ticks[ticks.length - 1]).split(" ")[1]);
                                                 }
                                                 if (!isFinite(price)) price = isFinite(close) ? close : 0;
                                                 if (!isFinite(close) || close <= 0) close = price;
                                                  var change = parseFloat(quote[31]);
                                                  var percent = parseFloat(quote[32]);
                                                  if (!isFinite(change)) change = price - close;
                                                  if (!isFinite(percent)) {
                                                          percent = close ? change / close * 100 : 0;
                                                  }
                                                 return {
                                                         code: code,
                                                         symbol: symbol,
                                                         name: String(quote[1]).trim(),
                                                         price: price,
                                                          close: close,
                                                          change: change,
                                                          percent: percent
                                                 };
                                         }

                                          function fetchQuoteBySymbol(symbol, code) {
                                                 var url = "https://bor.lingling123.top/chaojia/chaojia2_05_29/php/getgp.php?code=" +
                                                         encodeURIComponent(symbol) + "&rec=getDayKlinedata";
                                                 return fetch(url).then(function(response) {
                                                          if (!response || response.ok === false) {
                                                                  throw new Error("行情请求失败");
                                                          }
                                                         return response.json();
                                                 }).then(function(payload) {
                                                         var result = parseStockQuote(payload, symbol, code);
                                                         if (!result || !result.name) {
                                                                 throw new Error("未查询到该股票");
                                                         }
                                                         return result;
                                                 });
                                         }

                                          function fetchStockQuote(value) {
                                                  var code = normalizeStockCode(value);
                                                  if (!/^\d{6}$/.test(code) || typeof fetch !== "function") {
                                                          return Promise.reject(new Error("请输入正确的6位股票代码"));
                                                  }
                                                  return fetchQuoteBySymbol(stockSymbolFor(code), code);
                                          }

                                          function fetchMarketIndexQuote() {
                                                  if (typeof fetch !== "function") {
                                                          return Promise.reject(new Error("当前环境不支持行情请求"));
                                                  }
                                                  return fetchQuoteBySymbol("sh000001", "000001");
                                          }

                                          function quoteColor(change) {
                                                  return change > 0 ? "#e73130" :
                                                          (change < 0 ? "#08a94b" : "#323232");
                                          }

                                          function quoteTrendClass(change, percent) {
                                                  var signal = parseFloat(change);
                                                  if (!isFinite(signal) || Math.abs(signal) < 0.000001) {
                                                          signal = parseFloat(percent);
                                                  }
                                                  if (!isFinite(signal)) signal = 0;
                                                  return signal > 0 ? "quote-up" :
                                                          (signal < 0 ? "quote-down" : "quote-flat");
                                          }

                                          function applyQuoteTrend(box, change, percent) {
                                                  var trendClass = quoteTrendClass(change, percent);
                                                  var signal = parseFloat(change);
                                                  if (!isFinite(signal) || Math.abs(signal) < 0.000001) {
                                                          signal = parseFloat(percent);
                                                  }
                                                  if (!isFinite(signal)) signal = 0;
                                                  var color = quoteColor(signal);
                                                  var fields = box.find(".zuixin, .zhangfu, .zhangdie");
                                                  fields.removeClass("quote-up quote-down quote-flat")
                                                          .addClass(trendClass)
                                                          .css("color", color);
                                                  fields.each(function() {
                                                          if (this.style && this.style.setProperty) {
                                                                  this.style.setProperty("color", color, "important");
                                                          }
                                                  });
                                                  box.attr("data-trend", trendClass);
                                          }

                                          function updateMarketIndex(quote) {
                                                  var change = parseFloat(quote.change);
                                                  var percent = parseFloat(quote.percent);
                                                  if (!isFinite(change)) change = quote.price - quote.close;
                                                  if (!isFinite(percent)) {
                                                          percent = quote.close ? change / quote.close * 100 : 0;
                                                  }
                                                  var color = quoteColor(change);
                                                  $(".shangzhengbox").css("color", color);
                                                  $(".szdapan").text(quote.price.toFixed(2));
                                                  $(".szzhangdie").text(change.toFixed(2));
                                                  $(".szfudu").text(percent.toFixed(2));
                                                  $(".baifenhao img").attr(
                                                          "src",
                                                          change < 0 ?
                                                                  "hangqing/zx_baifengreen.png" :
                                                                  "hangqing/zx_baifenred.png"

                                          function refreshMarketIndex() {
                                                  return fetchMarketIndexQuote().then(updateMarketIndex)
                                                          .catch(function(error) {
                                                                  console.log("[LocalAPI] 上证指数行情暂不可用:", error.message);
                                                          });
                                          }

                                         function saveStockQuote(quote) {
                                                 if (window.LocalAPI && quote) {
                                                         LocalAPI.handle("savesanban", {
                                                                 username: Global_Username,
                                                                 code: quote.code,
                                                                 gupiao: quote.name,
                                                                 price: quote.price,
                                                                 z_pr: quote.close,
                                                                  change: quote.change,
                                                                  percent: quote.percent,
                                                                 quoteverified: "1"
                                                         });
                                                 }
                                         }

                                         function refreshWatchQuote(stock) {
                                                 if (!stock || !stock.code) return;
                                                 fetchStockQuote(stock.code).then(function(quote) {
                                                         saveStockQuote(quote);
                                                          var change = quote.change;
                                                          var percent = quote.percent;
                                                          var color = quoteColor(change);
                                                         var box = $('.zxitem[data-code="' + quote.code + '"]');
                                                         box.css("color", color);
                                                          applyQuoteTrend(box, change, percent);
                                                         box.find(".zx_name").text(quote.name);
                                                         box.find(".zuixin span").text(quote.price.toFixed(2));
                                                         box.find(".zhangfu span").text(percent.toFixed(2) + "%");
                                                         box.find(".zhangdie span").text(change.toFixed(2));
                                                 }).catch(function(error) {
                                                         console.log("[LocalAPI] 股票行情暂不可用:", stock.code, error.message);
                                                 });
                                         }

                                         function escapeStockText(value) {
                                                 return $("<div>").text(String(value == null ? "" : value)).html();
                                         }

                                         function renderStockRows(datas, mode) {
                                                 var container = $(".zx_container");
                                                 container.find(".zxitem, .stock-empty").remove();
                                                 $(".addkong").toggle(mode === "watch");
                                                  visibleQuoteStocks = [];
                                                 var rendered = 0;

                                                 $.each(datas || [], function(i, stock) {
                                                         var code = normalizeStockCode(stock.code || stock.jycode);
                                                         if (!/^\d{6}$/.test(code)) return;
                                                         var name = String(stock.gpname || stock.name || code);
                                                         var price = parseFloat(stock.xianjia);
                                                         var close = parseFloat(stock.shoupan);
                                                         if (!isFinite(price)) price = 0;
                                                         if (!isFinite(close) || close <= 0) close = price;
                                                         var change = price - close;
                                                         var percent = close ? change / close * 100 : 0;

                                                         if (name === "上证指数") {
                                                                 $(".szdapan").text(price.toFixed(2));
                                                                 $(".szzhangdie").text(change.toFixed(2));
                                                                 $(".szfudu").text(percent.toFixed(2));
                                                                 return;
                                                         }

                                                         var iconHtml = "";
                                                         var codeType = String(stock.codeType || stock.codetype || "");
                                                         if (codeType === "1") {
                                                                 iconHtml = '<div class="codeimg"><img src="hangqing/zx_rong.png" class="codetypeimg" /></div>';
                                                         } else if (codeType === "2") {
                                                                 iconHtml = '<div class="codeimg"><img src="hangqing/zx_chuang.png" class="codetypeimg" /></div>';
                                                         }
                                                          var color = quoteColor(change);
                                                         var trendClass = quoteTrendClass(change, percent);
                                                         var nameSize = name.length > 5 ? ".9rem" : "1.1rem";
                                                         var newItem =
                                                                 '<div class="zxitem" data-code="' + code + '" style="color:' + color + '">' +
                                                                         '<div class="zxitemm">' +
                                                                                 '<div class="itemm">' +
                                                                                         '<div class="zx_name" style="font-size:' + nameSize + '">' + escapeStockText(name) + '</div>' +
                                                                                         '<div class="codebox">' + iconHtml +
                                                                                                 '<div class="code">' + code + '</div>' +
                                                                                         '</div>' +
                                                                                 '</div>' +
                                                                                 '<div class="itemm zuixin ' + trendClass + '"><span>' + price.toFixed(2) + '</span></div>' +
                                                                                 '<div class="itemm zhangfu ' + trendClass + '"><span>' + percent.toFixed(2) + '%</span></div>' +
                                                                                 '<div class="itemm zhangdie ' + trendClass + '"><span>' + change.toFixed(2) + '</span></div>' +
                                                                         '</div>' +
                                                                         "<div style='width:100%;height:1px;position:relative;'>" +
                                                                                 "<img src='./hangqing/line.png' style='position:absolute;top:0;left:0'/>" +
                                                                         "</div>" +
                                                                 "</div>";
                                                         $(".addkong").before(newItem);
                                                         rendered++;
                                                          var visibleStock = { code: code, gpname: name, shoupan: close };
                                                          visibleQuoteStocks.push(visibleStock);
                                                          refreshWatchQuote(visibleStock);
                                                 });

                                                 if (!rendered) {
                                                         $(".addkong").before(
                                                                 '<div class="stock-empty">' +
                                                                 (mode === "holding" ? "暂无持仓股票" : "暂无自选股票") +
                                                                 "</div>"
                                                         );
                                                 }
                                         }

                                         function loadStockMode(mode) {
                                                 currentStockMode = mode === "holding" ? "holding" : "watch";
                                                 var requestedMode = currentStockMode;
                                                 $(".stock-mode-tab").removeClass("active");
                                                 $('.stock-mode-tab[data-mode="' + currentStockMode + '"]').addClass("active");
                                                 $(".addkong").toggle(currentStockMode === "watch");
                                                 $.post(host + "php/user.php", {
                                                         rec: currentStockMode === "holding" ? "ccload" : "zx_read",
                                                         username: Global_Username
                                                 }).done(function(data) {
                                                         var ok = data && (
                                                                 data.status === "success" ||
                                                                 data.status === "SUCCESS"
                                                         );
                                                         if (requestedMode !== currentStockMode) return;
                                                         var datas = requestedMode === "holding" ?
                                                                 (data && data.data) : (data && data.datas);
                                                         renderStockRows(ok ? datas : [], requestedMode);
                                                 });
                                         }

                                         $(".stock-mode-tab").click(function() {
                                                 loadStockMode($(this).data("mode"));
                                         });

                                          var initialStockMode = /(?:^|[?&])mode=holding(?:&|$)/.test(window.location.search) ?
                                                  "holding" : "watch";
                                          loadStockMode(initialStockMode);
                                          refreshMarketIndex();
                                          quoteRefreshTimer = setInterval(function() {
                                                  if (typeof window.isMarketOpen === "function" &&
                                                          !window.isMarketOpen()) {
                                                          return;
                                                  }
                                                  refreshMarketIndex();
                                                  $.each(visibleQuoteStocks, function(i, stock) {
                                                          refreshWatchQuote(stock);
                                                  });
                                          }, 5000);
                                          $(window).on("beforeunload", function() {
                                                  if (quoteRefreshTimer) clearInterval(quoteRefreshTimer);

					<script>
                                         var identifiedStock = null;
                                         var stockLookupTimer = null;
                                         var stockLookupSerial = 0;

                                         function setStockCodeStatus(message, type) {
                                                 $(".stock-code-status")
                                                         .removeClass("success error")
                                                         .addClass(type || "")
                                                         .text(message || "");
                                         }

                                         function identifyStockCode(value) {
                                                 var code = normalizeStockCode(value);
                                                 if (!/^\d{6}$/.test(code)) {
                                                         return Promise.reject(new Error("请输入正确的6位股票代码"));
                                                 }
                                                 var serial = ++stockLookupSerial;
                                                 identifiedStock = null;
                                                 $(".addnametext").val("");
                                                 $(".zxAddBtn").prop("disabled", true);
                                                 setStockCodeStatus("正在查询股票名称...");

                                                 return fetchStockQuote(code).then(function(quote) {
                                                         if (serial !== stockLookupSerial) {
                                                                 throw new Error("股票代码已更改");
                                                         }
                                                         identifiedStock = quote;
                                                         $(".addnametext").val(quote.name);
                                                         $(".zxAddBtn").prop("disabled", false);
                                                         setStockCodeStatus("已识别：" + quote.name, "success");
                                                         saveStockQuote(quote);
                                                         return quote;
                                                 }).catch(function(error) {
                                                         if (serial === stockLookupSerial) {
                                                                 identifiedStock = null;
                                                                 $(".addnametext").val("");
                                                                 $(".zxAddBtn").prop("disabled", true);
                                                                 setStockCodeStatus(error.message || "未查询到该股票", "error");
                                                         }
                                                         throw error;
                                                 });
                                         }

                                         $(".zxAddBtn").prop("disabled", true);
                                         $(".addcodetext").on("input", function() {
                                                 var code = normalizeStockCode($(this).val());
                                                 $(this).val(code);
                                                 clearTimeout(stockLookupTimer);
                                                 stockLookupSerial++;
                                                 identifiedStock = null;
                                                 $(".addnametext").val("");
                                                 $(".zxAddBtn").prop("disabled", true);

                                                 if (code.length < 6) {
                                                         setStockCodeStatus(code ? "请输入完整的6位股票代码" : "");
                                                         return;
                                                 }
                                                 stockLookupTimer = setTimeout(function() {
                                                         identifyStockCode(code).catch(function() {});
                                                 }, 350);
                                         });
