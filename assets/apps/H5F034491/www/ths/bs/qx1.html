					$("#UploadFile").change(function() {
						// this.files[0]代表的是选择的文件资源的第一个，因为上面写了 multiple="multiple" 就表示上传文件可能不止一个
						let imgname = this.files[0].name;
						var reads = new FileReader();
						f = document.getElementById("UploadFile").files[0];
						reads.readAsDataURL(f);
						reads.onload = function(e) {
							$("#PreviewImg").attr("src", this.result);
						}
						$("#UploadFile").val("");
					});
					//存储背景
					$(".SaveBack").click(function() {
						var option = $("#SelectTime").val();
						//获取用户名：
						var LocalBsGpData = localStorage.getItem("LocalBsGpData");
						LocalBsGpData = JSON.parse(LocalBsGpData);
						if (LocalBsGpData) {
							var localData = LocalBsGpData;
						} else {
							var localData = {};
						}
						username = UserData.username;
						if (localData[username]) {
							var GpData = localData[username];
						} else {
							var GpData = {};
						}
						if (GpData[LinkData.gpname]) {
							var UnitGpData = GpData[LinkData.gpname]
						} else {
							var UnitGpData = {};
						}
						var Imgsrc = $("#PreviewImg").attr("src");
						var DaType = $(".codeDaType").val();
						var Zenzhanglv = $(".Zenzhanglv").val();
						var SelectChuang = $("#SelectChuang").val();
						UnitGpData["src" + option] = Imgsrc;
						UnitGpData["code"] = LinkData.code;
						UnitGpData["datype"] = DaType;
						UnitGpData["zenzhanglv"] = Zenzhanglv;
						UnitGpData["Chuangflag"] = SelectChuang;
						GpData[LinkData.gpname] = UnitGpData;
						localData[username] = GpData;
						localStorage.setItem("LocalBsGpData", JSON.stringify(localData));

						// 重新加载当前页面
						location.reload();

					});

					//加载数据，从localstrage中加载
					function loadImg() {
						if (!UserData) {
							username = Global_username;
						} else {
							username = UserData.username;
						}
						LocalBsGpDatapp = JSON.parse(LocalBsGpData);
						if (LocalBsGpDatapp) {
							var localData = JSON.parse(LocalBsGpData);
							GpData = localData[username];
							UnitGpData = GpData[LinkData.gpname];
							if (UnitGpData) {
								Imgsrc = UnitGpData.src0;
								$(".kongbaiset").css("display", "none");
								$(".contentBox .contentBoxImg").attr("src", Imgsrc);

								$("#PreviewImg").attr("src", Imgsrc);
								$(".codeDaType").val(UnitGpData.datype);
								$(".Zenzhanglv").val(UnitGpData.zenzhanglv);
								$(".Datypename").html(UnitGpData.datype);
								if (parseFloat(UnitGpData.zenzhanglv.replace("%", "")) < 0) {
									$(".Datypelv").css("color", "#08a94b");
								} else if (parseFloat(UnitGpData.zenzhanglv.replace("%", "")) == 0) {
									$(".Datypelv").css("color", "#bdbdbd");
								}
								$(".Datypelv").html(UnitGpData.zenzhanglv);
								$(".centerBoxgpname").html(LinkData.gpname);
								$(".gpname").html(LinkData.gpname);

								if (UnitGpData.Chuangflag == "1") { //创业版需要显示，这里手动设置。
									$(".chuangchuang").css("display", "block");
								}
								$(".clickshezhi").css("display", "none");
							}
						}
					}

						var Imgsrc = $("#PreviewImg").attr("src");
						if (Imgsrc != "") {
							var BS_Lin = {};
							BS_Lin["linkData"] = LinkData;
							var option = $("#SelectTime").val();
							username = UserData.username;
							BS_Lin["Username"] = username;
							BS_Lin["Imgsrc"] = Imgsrc;
							BS_Lin["Option"] = option;
							localStorage.setItem("BS_Lin", JSON.stringify(BS_Lin));
							var p = window.location.href.replace("qx1", "index");
							if(Global_PhoneType=="Apple"){

							window.location.href = p;
